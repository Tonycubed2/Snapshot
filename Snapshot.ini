[General]
; Key to hold, as a DirectX scan code. 38 = L
iHotkey=38
; How many seconds the key must be held
fHoldSeconds=8
; How many of the newest saves to copy (each with its .skse co-save)
iSavesToCopy=3
; Outdoors: list every NPC within this many units of the player (indoors: every NPC in the same interior)
fOutdoorRadius=10000

[Journal]
; Progress Journal: crash-safe running record of progress, restore in F1 > Snapshot > Progress Journal
bEnabled=1
; How often player and follower positions are checked (seconds)
fPositionSeconds=5
; A position is written only after moving at least this many units (or changing cell)
fPositionMinMove=256
